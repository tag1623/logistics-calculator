<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物流運搬シミュレーター 修正版</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#edf3f8;color:#193047;margin:0}header{background:#123451;color:white;padding:22px 16px}h1{font-size:21px;margin:0}main{max-width:620px;margin:auto;padding:14px}.card{background:white;border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 2px 9px #10203010}h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}input{width:100%;padding:12px 8px;font-size:19px;border:1px solid #a7bbce;border-radius:9px}button{border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;background:#12699d;color:white;width:100%;margin-top:13px}.secondary{background:#dce9f2;color:#16364e}.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{background:#e9f3fa;border-radius:10px;padding:14px}.wide{grid-column:1/-1}.result small{display:block;font-size:12px}.result strong{font-size:25px;display:block;margin-top:5px}p{font-size:13px;line-height:1.6}#error{color:#bb2424;font-weight:600}#status{color:#226342}</style></head><body><header><h1>🚚 物流運搬シミュレーター</h1><p>修正版：自動計算＋計算ボタン</p></header><main><section class="card"><h2>運搬条件の試算</h2><div class="grid"><div><label for="production">生産台数（台）</label><input id="production" type="number" value="400" min="0"></div><div><label for="usage">部品使用率（％）</label><input id="usage" type="number" value="70" min="0" max="100"></div><div><label for="capacity">1回の積載数（個）</label><input id="capacity" type="number" value="12" min="1"></div><div><label for="minutes">運搬時間（分／回）</label><input id="minutes" type="number" value="2.5" min="0" step="0.1"></div><div><label for="workers">作業員数（人）</label><input id="workers" type="number" value="2" min="1"></div></div><button id="calculate" type="button">計算する</button><button id="reset" class="secondary" type="button">初期値に戻す</button><p id="status">数字を変更すると自動計算します。</p></section><section class="card"><h2>計算結果</h2><p id="error"></p><div class="results"><div class="result"><small>必要運搬回数</small><strong id="trips">24回</strong></div><div class="result"><small>総運搬工数</small><strong id="total">60.0分</strong></div><div class="result wide"><small>1人あたりの運搬時間（均等配分）</small><strong id="per">0.50時間</strong><small id="permin">30.0分／人</small></div></div><button id="baseline" class="secondary" type="button">現在の結果を改善前として保存</button><p id="comparison">改善前は未設定です。</p></section><p>計算式：運搬回数＝生産台数×使用率÷積載数（切り上げ）。総運搬工数＝運搬回数×運搬時間。1人あたり＝総運搬工数÷作業員数。1台につき最大1個の部品使用を想定。待機時間は含みません。</p></main><script>
(function(){'use strict';var names=['production','usage','capacity','minutes','workers'];function byId(x){return document.getElementById(x)}var baseline=null;function calculate(){var v={},i;for(i=0;i<names.length;i++){var field=byId(names[i]);if(field.value.trim()===''){byId('error').textContent='すべての項目を入力してください。';return null}v[names[i]]=Number(field.value)}if(!Number.isInteger(v.production)||v.production<0||v.usage<0||v.usage>100||!Number.isInteger(v.capacity)||v.capacity<1||v.minutes<0||!Number.isInteger(v.workers)||v.workers<1||names.some(function(n){return !Number.isFinite(v[n])})){byId('error').textContent='入力を確認してください。台数・積載数・人数は整数、使用率は0～100です。';return null}byId('error').textContent='';var trips=Math.ceil(v.production*v.usage/100/v.capacity),total=trips*v.minutes,per=total/v.workers;byId('trips').textContent=trips+'回';byId('total').textContent=total.toFixed(1)+'分';byId('per').textContent=(per/60).toFixed(2)+'時間';byId('permin').textContent=per.toFixed(1)+'分／人';if(baseline!==null){var diff=total-baseline;byId('comparison').textContent='改善前：'+baseline.toFixed(1)+'分 ／ 現在：'+total.toFixed(1)+'分 ／ '+(diff<0?'削減 ':diff>0?'増加 ':'差分 ')+Math.abs(diff).toFixed(1)+'分'}byId('status').textContent='計算済み';return total}names.forEach(function(n){byId(n).addEventListener('input',calculate);byId(n).addEventListener('change',calculate)});byId('calculate').addEventListener('click',calculate);byId('reset').addEventListener('click',function(){var d=[400,70,12,2.5,2];names.forEach(function(n,i){byId(n).value=d[i]});calculate()});byId('baseline').addEventListener('click',function(){var t=calculate();if(t!==null){baseline=t;byId('comparison').textContent='改善前：'+t.toFixed(1)+'分。数値を変更して比較できます。'}});calculate()})();
</script></body></html>
